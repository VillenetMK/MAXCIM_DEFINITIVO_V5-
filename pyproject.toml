[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxcim-v5"
version = "5.0.0"
description = "MAXCIM: control ROS 2, consola de equipo y aplicaciones educativas"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14.4,<3.15", "PyYAML>=6,<7"]

[project.optional-dependencies]
hardware = ["pyserial>=3.5,<4"]

[project.scripts]
maxcim-api = "maxcim_api.server:main"
maxcim-admin = "maxcim_api.admin:main"

[tool.setuptools]
packages = ["maxcim_core", "maxcim_api"]

[tool.setuptools.package-dir]
maxcim_core = "packages/maxcim_core"
maxcim_api = "backend/maxcim_api"
