services:
  console:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAXCIM_MODE: simulation
      MAXCIM_ALLOWED_ORIGINS: ${MAXCIM_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      MAXCIM_COOKIE_SECURE: ${MAXCIM_COOKIE_SECURE:-false}
    volumes:
      - team-data:/data
    restart: unless-stopped
volumes:
  team-data:
