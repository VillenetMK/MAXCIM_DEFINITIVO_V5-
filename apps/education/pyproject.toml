[tool.coverage.run]
branch = true
source = ["app", "services"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Solo errores reales (sintaxis, imports/variables sin uso, nombres
# indefinidos); el estilo del monolito no se fuerza en CI.
select = ["E9", "F"]
