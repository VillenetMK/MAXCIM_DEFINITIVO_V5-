name: MAXCIM checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: bash scripts/check.sh
      - run: npm install --no-save playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        env:
          MAXCIM_DATABASE: /tmp/maxcim-ci.db
          MAXCIM_TEST_CREDENTIALS: /tmp/maxcim-ci-account.json
        run: |
          python - <<'PY'
          import json, secrets, os
          from maxcim_api.store import Store
          password=secrets.token_urlsafe(24)
          store=Store(os.environ['MAXCIM_DATABASE'])
          store.create_user('ci-user',password,'admin')
          store.close()
          with open(os.environ['MAXCIM_TEST_CREDENTIALS'],'w') as f:
              json.dump({'username':'ci-user','password':password},f)
          PY
          python -m maxcim_api.server > /tmp/maxcim-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; rm -f "$MAXCIM_TEST_CREDENTIALS"' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('API unavailable')
          PY
          node scripts/browser-check.cjs
  ros-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip ros-jazzy-sensor-msgs ros-jazzy-std-srvs
          python3 -m pip install --break-system-packages -e '.[hardware]'
      - name: Build generated interfaces and control packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base robot/ros2/log build --base-paths robot/ros2/src --build-base robot/ros2/build --install-base robot/ros2/install --packages-select maxcim_interfaces maxcim_control maxcim_base maxcim_odometry --symlink-install
          source robot/ros2/install/setup.bash
          python3 robot/base-reference/tests/ros_smoke.py
          python3 tests/ros_gateway_smoke.py
