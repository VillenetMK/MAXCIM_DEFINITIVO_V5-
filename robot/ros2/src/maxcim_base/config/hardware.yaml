/**:
  ros__parameters:
    use_sim_time: false
    calibration_confirmed: false
    forward_direction_confirmed: false
    # Pegar una ruta real de /dev/serial/by-id/. Nunca seleccionar ttyUSB0 por azar.
    serial_port: ""
    # Medir ambos radios bajo carga; metros. Cero = pendiente, NO valor del robot.
    left_wheel_radius_m: 0.0
    right_wheel_radius_m: 0.0
    wheel_separation_m: 0.0
    # Pulsos FALLING medidos por vuelta completa de rueda (después de reductora).
    left_pulses_per_revolution: 0.0
    right_pulses_per_revolution: 0.0
    # Límite inicial solicitado; no afirmación de velocidad real alcanzable.
    max_wheel_speed_mps: 0.10
    max_wheel_acceleration_mps2: 0.10
    command_timeout_s: 0.30
    feedback_timeout_s: 0.25
    max_sample_gap_s: 0.25
    max_feedback_age_s: 0.25
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
